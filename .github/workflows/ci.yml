name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run validate:content
      - name: Build + smoke (staged)
        run: npm run build && npm run smoke
      - name: Structured-data audit (JSON-LD, every page + type)
        run: npm run test:jsonld
      - name: Performance budget (raw bytes + DOM, growth-aware)
        run: npm run test:perf
      - name: Headless browser smoke (no console errors; interactivity works)
        run: npx playwright install --with-deps chromium && npm run test:e2e
      - name: Accessibility guard (axe WCAG 2.1 AA + keyboard/layout, staged build)
        run: npm run test:a11y
      - name: Build + smoke (SITE_LIVE)
        run: SITE_LIVE=true npm run build && npm run smoke
